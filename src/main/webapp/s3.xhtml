<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

  <h:head>
    <title>S3</title>
  </h:head>
  <h:body>
    <h1>AWS SDK for Java v2を用いたJavaによるS3操作</h1>

    <h3>S3オブジェクト一覧取得 + ダウンロード</h3>
    <table border="1">
        <tr>
            <th>オブジェクト</th>
            <th>ダウンロード</th>
        </tr>
        <ui:repeat var="row" value="#{useS3Action.s3ObjectList}">
            <tr>
                <td><h:outputText value="#{row}" /></td>
                <td>
                    <h:form>
                        <h:commandLink value="ダウンロード" action="#{useS3Action.s3FileDownload}">
                            <f:setPropertyActionListener target="#{useS3Action.file}" value="#{row}" />
                        </h:commandLink>
                    </h:form>
                </td>
            </tr>
        </ui:repeat>
    </table>

    <br /><br />

    <h3>アップロード</h3>
    <h:form enctype="multipart/form-data">
        <h:outputLabel for="inputFile" value="ファイルアップロード：" /><br/>
        <h:inputFile id="inputFile" value="#{useS3Action.inputFile}" /><br/><br/>

        <h:commandButton value="送信" action="#{useS3Action.s3FileUpload()}" />
    </h:form>

  </h:body>
</html>
